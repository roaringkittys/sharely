<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Sharely</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/membership/css/membership.css">
</head>
<body class="mp">
  <nav class="mp-nav">
    <div class="mp-nav-inner">
      <a href="/membership" class="mp-logo"><div class="mp-logo-mark">S</div>Sharely</a>
      <div></div>
      <div class="mp-nav-actions">
        <a href="/membership/pricing" class="mp-btn mp-btn-ghost mp-btn-sm">← Back to plans</a>
      </div>
    </div>
  </nav>

  <section class="mp-section">
    <div class="mp-container">
      <div class="mp-checkout-grid">
        <div class="mp-card">
          <h3 style="margin-bottom:20px;">Complete your purchase</h3>
          <div id="alertBox" class="mp-alert mp-alert-error"></div>

          <div id="guestForm">
            <div class="mp-field">
              <label>Email address</label>
              <input type="email" id="emailInput" placeholder="you@example.com" required autocomplete="email" />
            </div>
            <div class="mp-field">
              <label>Full name</label>
              <input type="text" id="nameInput" placeholder="Your name" required autocomplete="name" />
            </div>
            <button type="button" class="mp-btn mp-btn-primary mp-btn-block" id="payBtn">Pay now</button>
            <p style="font-size:12.5px; color:var(--mp-text-faint); text-align:center; margin-top:14px;">Secured by Midtrans. You will be redirected to a safe payment page.</p>
          </div>

          <div id="memberForm" style="display:none;">
            <p class="mp-auth-sub">Logged in as <strong id="memberEmail"></strong>. <a href="/membership/login">Switch account</a></p>
            <button type="button" class="mp-btn mp-btn-primary mp-btn-block" id="memberPayBtn">Pay now</button>
          </div>
        </div>

        <div class="mp-card">
          <h3 style="margin-bottom:20px;">Order summary</h3>
          <div id="summaryBox">Loading…</div>
        </div>
      </div>
    </div>
  </section>

  <script src="/membership/js/membership.js"></script>
  <script src="/membership/js/checkout.js"></script>
</body>
</html>
