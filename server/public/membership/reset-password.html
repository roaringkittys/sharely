<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Toolbase</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/membership/css/membership.css">
</head>
<body class="mp">
  <div class="mp-auth-wrap">
    <div class="mp-auth-card">
      <a href="/membership" class="mp-logo"><div class="mp-logo-mark">T</div>Toolbase</a>
      <h1>Set a new password</h1>
      <p class="mp-auth-sub">Choose a new password for your account.</p>

      <div id="alertBox" class="mp-alert mp-alert-error"></div>

      <form id="resetForm">
        <div class="mp-field">
          <label>New password</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="mp-btn mp-btn-primary mp-btn-block" id="submitBtn">Reset password</button>
      </form>

      <div class="mp-auth-footer">
        <a href="/membership/login">Back to log in</a>
      </div>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get('token');

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');
      alertBox.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        const res = await fetch('/api/membership/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: document.getElementById('password').value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Reset failed');
        window.location.href = '/membership/login';
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Reset password';
      }
    });
  </script>
</body>
</html>
