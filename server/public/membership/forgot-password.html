<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — Toolbase</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/membership/css/membership.css">
</head>
<body class="mp">
  <div class="mp-auth-wrap">
    <div class="mp-auth-card">
      <a href="/membership" class="mp-logo"><div class="mp-logo-mark">T</div>Toolbase</a>
      <h1>Reset your password</h1>
      <p class="mp-auth-sub">Enter your email and we'll send you a reset link.</p>

      <div id="alertBox" class="mp-alert"></div>

      <form id="forgotForm">
        <div class="mp-field">
          <label>Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <button type="submit" class="mp-btn mp-btn-primary mp-btn-block" id="submitBtn">Send reset link</button>
      </form>

      <div class="mp-auth-footer">
        <a href="/membership/login">Back to log in</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');
      btn.disabled = true;
      btn.textContent = 'Sending…';

      try {
        await fetch('/api/membership/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value }),
        });
        alertBox.textContent = 'If an account exists for that email, a reset link has been sent.';
        alertBox.className = 'mp-alert mp-alert-success show';
        btn.textContent = 'Link sent';
      } catch (err) {
        alertBox.textContent = 'Something went wrong. Please try again.';
        alertBox.className = 'mp-alert mp-alert-error show';
        btn.disabled = false;
        btn.textContent = 'Send reset link';
      }
    });
  </script>
</body>
</html>
