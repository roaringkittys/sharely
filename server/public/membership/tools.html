<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My tools — Toolbase</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/membership/css/membership.css">
</head>
<body class="mp">
  <div class="mp-app">
    <aside class="mp-app-sidebar">
      <a href="/membership" class="mp-logo"><div class="mp-logo-mark">T</div>Toolbase</a>
      <nav class="mp-app-nav">
        <a href="/membership/dashboard">🏠 Dashboard</a>
        <a href="/membership/tools" class="active">🧰 My tools</a>
        <a href="/membership/billing">💳 Billing</a>
        <a href="/membership/upgrade">⬆️ Upgrade plan</a>
        <a href="/membership/settings">⚙️ Settings</a>
      </nav>
      <a href="#" id="logoutBtn" style="padding:10px 12px; color:var(--mp-text-dim); font-size:14px;">↩ Log out</a>
    </aside>

    <main class="mp-app-main">
      <div class="mp-app-header">
        <div>
          <h1>My tools</h1>
          <p>Tools included in your current plan.</p>
        </div>
      </div>
      <div class="mp-tool-grid" id="toolsGrid"></div>
    </main>
  </div>

  <script src="/membership/js/membership.js"></script>
  <script>
    (async function () {
      const data = await MembershipUI.requireMemberSession();
      if (!data) return;

      const res = await fetch('/api/membership/my-tools');
      const { tools } = await res.json();
      const grid = document.getElementById('toolsGrid');
      if (tools.length === 0) {
        grid.innerHTML = '<div class="mp-empty">No tools available yet. <a href="/membership/pricing" style="color:var(--mp-accent-2);">Choose a plan</a> to unlock your bundle.</div>';
      } else {
        grid.innerHTML = tools.map(t => `
          <div class="mp-tool-card">
            <div class="mp-feature-icon">${t.icon}</div>
            <h3>${t.name}</h3>
            <p>${t.description}</p>
          </div>
        `).join('');
      }
    })();

    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/membership/logout', { method: 'POST' });
      window.location.href = '/membership/login';
    });
  </script>
</body>
</html>
